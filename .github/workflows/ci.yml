# CI gate. The single source of truth is the committed Makefile: this workflow
# is a thin caller that runs the SAME `make verify` you run locally.
# Contract and target details: the Go handbook, operations/ci-and-release.md.
#
# Destination: .github/workflows/ci.yml

name: ci

on:
  push:
    branches: [main] # default branch only; PR builds cover the rest
  pull_request:
  workflow_call:

# Least privilege. Read source; grant nothing else. Add scopes per-job only when
# a job genuinely needs them (e.g. release publishing).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # single source of truth for the Go version
          cache: true # build + module cache, keyed off go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc # single source of truth for the Node version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-ci # frontend dependencies from the lockfile
      - run: make verify # both gates: Go (tidy/fmt/lint/vet/test/race/vuln/build) then web (format/lint/typecheck/test/audit/build)

  # Second gate: prove the PostgreSQL path at parity with SQLite (ADR 0004).
  # 'verify' above is the OFFLINE gate: it already runs the migration up/down/up
  # and account-store suite against in-memory SQLite. This job spins up a real
  # Postgres service container and runs the //go:build integration tests, which
  # execute the SAME suite against it, so both supported engines are exercised
  # on every push.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
          POSTGRES_DB: bloom
        ports:
          - 5432:5432
        # Hold the job's steps until Postgres answers, so tests never race a
        # database that is still initializing.
        options: >-
          --health-cmd "pg_isready -U bloom -d bloom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The integration suite reads BLOOM_TEST_POSTGRES_DSN and skips when it is
      # unset (internal/db/postgres_integration_test.go); here it is always set,
      # so the PostgreSQL path is proven. The embedded goose migrations create
      # the schema.
      - run: go test -tags=integration ./...
        env:
          BLOOM_TEST_POSTGRES_DSN: "postgres://bloom:bloom@localhost:5432/bloom?sslmode=disable"
