# Release gate: builds and publishes the image on a v* tag. CI proves the commit;
# this only packages it. Contract: coding-handbook golang/operations/ci-and-release.md

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IMAGE="ghcr.io/bonztm/bloom:${VERSION}"
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT="${COMMIT}" \
            --build-arg CREATED="${CREATED}" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"
