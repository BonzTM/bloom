openapi: 3.1.0
info:
  title: Bloom API
  version: 0.1.0
  summary: Self-hosted Jellyfin companion; invites, statistics, and requests.
  description: |
    Bloom's JSON API. It is the only way the embedded SPA (ADR 0002) talks to
    the backend, so this document is the contract the frontend builds against.

    Conventions (from the Go handbook, foundations/serialization.md):

    - Every error response, on every endpoint, is the `ErrorResponse` envelope.
      Unknown routes under `/api/` return it too, never HTML.
    - `code` is a machine-readable string enum the client may branch on. It is
      not the HTTP status. The set only grows; a code is never repurposed.
    - 5xx bodies are opaque: a generic `message` plus `request_id`. The detail
      lives in the server log under that id.
    - Every response carries `X-Request-ID`. A client may send its own (up to
      128 characters) and it is echoed; otherwise one is generated.
    - Field names are `snake_case`. Timestamps are RFC 3339 in UTC.
    - Browser authentication uses a server-side session. The cookie contains
      only an opaque session token and is never an API credential.
    - Permission identifiers are stable API contract values. The catalog may
      grow additively; published identifiers are never renamed or removed.
servers:
  - url: /
    description: Same origin as the SPA.
tags:
  - name: meta
    description: Build metadata.
  - name: probes
    description: Platform health probes and the metrics scrape endpoint.
  - name: auth
    description: Local login and server-side browser sessions.
  - name: roles
    description: Permission-based role information.
  - name: media-servers
    description: Registered media-server connections. Credentials are write-only.
  - name: download-managers
    description: Registered Radarr and Sonarr connections. Credentials are write-only.
  - name: invites
    description: Administrative invite management and public redemption.
  - name: playback
    description: Administrator playback activity and history.
  - name: stats
    description: Administrator statistics dashboards computed from recorded watches.
  - name: metadata
    description: TMDB-backed search, details, and write-only provider credentials.
  - name: requests
    description: Request profiles, media requests, approvals, and quotas.
paths:
  /api/v1/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: Build metadata of the running binary.
      responses:
        "200":
          description: Version information stamped at build time.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                name: bloom
                version: v0.1.0
                commit: 0123456789abcdef0123456789abcdef01234567
  /livez:
    get:
      tags: [probes]
      operationId: livez
      summary: Liveness probe.
      description: |
        Process-up only. Never depends on the database or any downstream, so a
        dependency outage cannot turn into a restart loop.
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            text/plain:
              schema:
                type: string
                const: ok
  /readyz:
    get:
      tags: [probes]
      operationId: readyz
      summary: Readiness probe.
      description: |
        Returns 200 only when the service may receive traffic: the readiness
        flag is up (it flips down before shutdown drains) and the configured
        database answers a ping within 2 seconds.
      responses:
        "200":
          description: Ready to serve traffic.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            text/plain:
              schema:
                type: string
                const: ready
        "503":
          description: Not ready. The `code` is `unavailable`.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: unavailable
                message: Service Unavailable
                request_id: 4f1a7c0e9b2d4e6f8a0c1b2d3e4f5a6b
  /metrics:
    get:
      tags: [probes]
      operationId: metrics
      summary: Prometheus scrape endpoint.
      responses:
        "200":
          description: Prometheus text exposition format.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a local browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Sets the `bloom_session` cookie.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccountResponse"
        "401":
          description: Invalid credentials, or a malformed inbound session. Credential failures are indistinguishable. A rejected session expires the cookie with `Set-Cookie` before credential authentication runs.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected by CSRF protection.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Missing or unsupported request media type. The `code` is `unsupported_media_type`.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Malformed JSON or invalid fields.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Login rate limit exceeded. `Retry-After` is seconds.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/AuthInternalError"
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedPost"
        "503":
          description: Password-verification capacity is exhausted. `Retry-After` is seconds.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/providers:
    get:
      tags: [auth]
      operationId: getAuthProviders
      summary: List enabled browser sign-in methods.
      responses:
        "200":
          description: Local sign-in is always present; OIDC is present when enabled.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlPublic" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvidersResponse"
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedGet"
  /api/v1/auth/oidc/start:
    post:
      tags: [auth]
      operationId: startOIDC
      summary: Start an OpenID Connect authorization-code flow with PKCE.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                return_to:
                  type: string
                  maxLength: 2048
                  description: Optional same-origin application path used after sign-in.
      responses:
        "303":
          description: Redirect to the configured provider. Flow secrets are stored only in the server-side session.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Location: { $ref: "#/components/headers/Location" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        "500":
          $ref: "#/components/responses/AuthInternalError"
        "400":
          description: The form body is malformed. The `code` is `invalid_argument`.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: The supplied session cookie is malformed.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Cross-origin protection rejected the request.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: OIDC is disabled, so the route is not mounted.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: Content-Type is not `application/x-www-form-urlencoded`.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Per-client start rate limit exceeded. `Retry-After` is bounded whole seconds.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: The form contains an unknown field, repeated `return_to`, or a `return_to` longer than 2,048 characters. The `code` is `validation_failed`.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedPost"
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: completeOIDC
      summary: Validate the OpenID Connect callback and establish a browser session.
      description: |
        A successful callback redirects to the validated return path. A failed
        browser callback whose `Accept` header includes `text/html` redirects
        to the configured public URL at `/login?error=<code>`. `code` is one of
        `unknown_identity`, `provisioning_disabled`, `state_invalid`,
        `token_invalid`, `provider_unavailable`, `disabled`, or
        `internal_error`. Provider error text is never included. Callers that
        do not accept HTML receive the JSON outcomes below.
      parameters:
        - in: query
          name: state
          required: true
          description: Must occur exactly once and contain at most 512 ASCII characters.
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '^[\x00-\x7F]*$' }
        - in: query
          name: code
          required: false
          description: When present, must occur exactly once and contain at most 4096 ASCII characters.
          schema: { type: string, maxLength: 4096, pattern: '^[\x00-\x7F]*$' }
        - in: query
          name: error
          required: false
          description: When present, must occur exactly once and contain at most 256 ASCII characters.
          schema: { type: string, maxLength: 256, pattern: '^[\x00-\x7F]*$' }
      responses:
        "303":
          description: Signed in and redirected to the validated return path, or a failed browser sign-in redirected with an `OIDCCallbackErrorCode` query value.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Location: { $ref: "#/components/headers/Location" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        "401":
          description: State, nonce, token, or verified claim validation failed (`oidc_rejected`); the account is disabled (`invalid_credentials`); or the session cookie is malformed (`unauthorized`).
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The identity is unknown or automatic provisioning is disabled. The `code` is `forbidden`.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Callback rate limit exceeded.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/AuthInternalError"
        "503":
          description: Provider work capacity is exhausted or the provider is transiently unavailable. The body is opaque and `Retry-After` is bounded whole seconds.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: OIDC is disabled, so the route is not mounted.
          headers:
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedGet"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Destroy the current browser session.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session destroyed.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        "401":
          description: No live session.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected by CSRF protection.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/AuthInternalError"
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedPost"
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentAccount
      summary: Return the account for the current browser session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current account.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccountResponse"
        "401":
          description: No live session, or the account was deleted or disabled.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/AuthInternalError"
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedGet"
  /api/v1/auth/permissions:
    get:
      tags: [auth]
      operationId: listPermissions
      summary: Return the public stable permission catalog.
      description: Permission identifiers only grow additively and are never renamed or removed.
      responses:
        "200":
          description: The complete permission catalog in stable contract order.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlPublic" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedGet"
  /api/v1/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles and their effective permission sets.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as `next_cursor` by the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 86
        - name: page_size
          in: query
          required: false
          description: Requested role count. Defaults to 50; values above 100 are clamped to 100.
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: At most 100 roles ordered by name, with each permission set sorted.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "401":
          description: No live session. Invalid or revoked session cookies are expired.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account lacks `admin.roles`. The `code` is `forbidden`.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid cursor or page-size query value.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
            Vary: { $ref: "#/components/headers/VaryCookie" }
            X-Request-ID: { $ref: "#/components/headers/XRequestID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/AuthInternalError"
        "405":
          $ref: "#/components/responses/AuthMethodNotAllowedGet"
  /api/v1/media-servers:
    post:
      tags: [media-servers]
      operationId: createMediaServer
      summary: Probe and register a media server.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaServerRequest"
      responses:
        "201":
          $ref: "#/components/responses/MediaServerCreated"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/MediaServerFailure" }
        "503": { $ref: "#/components/responses/MediaServerBusy" }
        "405": { $ref: "#/components/responses/AuthMethodNotAllowedPostGet" }
    get:
      tags: [media-servers]
      operationId: listMediaServers
      summary: List registered media servers.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 400 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        "200":
          $ref: "#/components/responses/MediaServersListed"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/AuthMethodNotAllowedPostGet" }
  /api/v1/media-servers/{id}:
    get:
      tags: [media-servers]
      operationId: getMediaServer
      summary: Return one registered server and its capabilities.
      parameters:
        - $ref: "#/components/parameters/MediaServerID"
      security:
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/MediaServerReturned"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/AuthMethodNotAllowedGetDelete" }
    delete:
      tags: [media-servers]
      operationId: deleteMediaServer
      summary: Delete a registered media server.
