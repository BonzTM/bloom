        titles: { type: array, maxItems: 15, items: { $ref: "#/components/schemas/StatsTitle" } }
        users: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/StatsUser" } }
        clients: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/StatsBreakdown" } }
        devices: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/StatsBreakdown" } }
        play_methods: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/StatsBreakdown" } }
    StatsDailyResponse:
      type: object
      required: [window, items]
      additionalProperties: false
      properties:
        window: { $ref: "#/components/schemas/StatsWindow" }
        items: { type: array, maxItems: 367, items: { $ref: "#/components/schemas/StatsDailyBucket" } }
    StatsPatternsResponse:
      type: object
      required: [window, weekdays, hours]
      additionalProperties: false
      properties:
        window: { $ref: "#/components/schemas/StatsWindow" }
        weekdays: { type: array, minItems: 7, maxItems: 7, items: { $ref: "#/components/schemas/StatsWeekdayBucket" } }
        hours: { type: array, minItems: 24, maxItems: 24, items: { $ref: "#/components/schemas/StatsHourBucket" } }
    StatsTitlesResponse:
      type: object
      required: [window, kind, items]
      additionalProperties: false
      properties:
        window: { $ref: "#/components/schemas/StatsWindow" }
        kind: { $ref: "#/components/schemas/StatsTitleKind" }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/StatsTitle" } }
    StatsUsersResponse:
      type: object
      required: [window, items]
      additionalProperties: false
      properties:
        window: { $ref: "#/components/schemas/StatsWindow" }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/StatsUser" } }
    StatsUserResponse:
      type: object
      required: [window, totals, titles, clients, devices, play_methods, daily, watches]
      additionalProperties: false
      properties:
        window: { $ref: "#/components/schemas/StatsWindow" }
        totals: { $ref: "#/components/schemas/StatsTotals" }
        titles: { type: array, maxItems: 15, items: { $ref: "#/components/schemas/StatsTitle" } }
        clients: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/StatsBreakdown" } }
        devices: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/StatsBreakdown" } }
        play_methods: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/StatsBreakdown" } }
        daily: { type: array, maxItems: 367, items: { $ref: "#/components/schemas/StatsDailyBucket" } }
        watches: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/PlaybackWatch" } }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Raw submitted username, bounded before canonicalization. The server canonicalizes it with the PRECIS UsernameCaseMapped profile, then validates the canonical comparison key's length and syntax. Equivalent case, width, and normalized forms are accepted.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          description: Length is measured in Unicode code points.
    AuthProvider:
      type: object
      required: [id, display_name]
      additionalProperties: false
      properties:
        id:
          type: string
          enum: [local, oidc]
        display_name:
          type: string
          minLength: 1
          maxLength: 80
    AuthProvidersResponse:
      type: object
      required: [providers]
      additionalProperties: false
      properties:
        providers:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/AuthProvider"
    AccountSummary:
      type: object
      required: [id, username]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[\\p{L}\\p{Nd}](?:[\\p{L}\\p{Nd}._-]*[\\p{L}\\p{Nd}])?$"
          description: Canonical PRECIS UsernameCaseMapped display username.
    CurrentAccountResponse:
      type: object
      required: [account, roles, permissions]
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        roles:
          type: array
          items:
            type: string
          description: Assigned role names in sorted order.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: Effective permissions in sorted order.
    Permission:
      type: string
      description: Stable permission identifier. Values may only be added.
      enum:
        - users.read
        - users.invite
        - users.manage
        - requests.read.own
        - requests.create
        - requests.approve
        - stats.read.own
        - stats.read.all
        - admin.settings
        - admin.roles
    PermissionCatalogEntry:
      type: object
      required: [id, module]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Permission"
        module:
          type: string
          enum: [users, requests, stats, admin]
    PermissionCatalogResponse:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCatalogEntry"
    Role:
      type: object
      required: [id, name, description, built_in, created_at, permissions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        built_in:
          type: boolean
        created_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    RolesResponse:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Role"
        next_cursor:
          type: string
          maxLength: 86
          description: Opaque cursor for the next page, or an empty string on the final page.
    Version:
      type: object
      required: [name, version, commit]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Service name; always `bloom`.
        version:
          type: string
          description: Release tag in `vMAJOR.MINOR.PATCH` form, or `dev` for an unstamped build.
        commit:
          type: string
          description: VCS revision the binary was built from, or `unknown`.
    ErrorResponse:
      type: object
      description: The single structured error envelope returned by every endpoint.
      required: [code, message, request_id]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable and safe to surface. Generic for 5xx.
        fields:
          type: array
          description: Per-field validation failures. Present only when `code` is `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"
        request_id:
          type: string
          description: Correlation id, also sent as the `X-Request-ID` header.
    ErrorCode:
      type: string
      description: |
        Machine-readable failure class. Evolves additively.
      enum:
        - not_found
        - already_exists
        - invalid_argument
        - unavailable
        - internal
        - invalid_credentials
        - unauthorized
        - validation_failed
        - rate_limited
        - csrf_rejected
        - unsupported_media_type
        - method_not_allowed
        - forbidden
        - media_server_failure
        - oidc_rejected
        - username_unavailable
        - metadata_not_configured
        - metadata_provider_failure
        - request_quota_exceeded
        - request_profile_in_use
        - invalid_request_transition
        - download_manager_failure
        - download_manager_not_found
        - download_manager_in_use
    OIDCCallbackErrorCode:
      type: string
      description: Closed browser-facing OIDC callback failure code set.
      enum:
        - unknown_identity
        - provisioning_disabled
        - state_invalid
        - token_invalid
        - provider_unavailable
        - disabled
        - internal_error
    FieldError:
      type: object
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dotted path into the request body, e.g. `items.0.qty`.
        code:
          type: string
          description: Small machine-readable enum, e.g. `required`, `out_of_range`.
        message:
          type: string
