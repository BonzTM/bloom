      responses: { "200": { description: Request quota., content: { application/json: { schema: { $ref: "#/components/schemas/RequestQuota" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "500": { $ref: "#/components/responses/InternalError" }, "405": { $ref: "#/components/responses/MethodNotAllowed" } }
    put: &SetQuotaOperation
      tags: [requests]
      operationId: setRoleRequestQuota
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequestQuotaInput" } } } }
      responses: { "200": { description: Request quota stored., content: { application/json: { schema: { $ref: "#/components/schemas/RequestQuota" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "415": { $ref: "#/components/responses/UnsupportedMediaType" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "500": { $ref: "#/components/responses/InternalError" }, "405": { $ref: "#/components/responses/MethodNotAllowed" } }
    delete: &DeleteQuotaOperation
      tags: [requests]
      operationId: deleteRoleRequestQuota
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityID" }]
      responses: { "204": { description: Request quota removed. }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "500": { $ref: "#/components/responses/InternalError" }, "405": { $ref: "#/components/responses/MethodNotAllowed" } }
  /api/v1/accounts/{id}/request-quota:
    get:
      <<: *GetQuotaOperation
      operationId: getAccountRequestQuota
    put:
      <<: *SetQuotaOperation
      operationId: setAccountRequestQuota
    delete:
      <<: *DeleteQuotaOperation
      operationId: deleteAccountRequestQuota
  /api/v1/playback/history:
    get:
      tags: [playback]
      operationId: listPlaybackHistory
      summary: List closed watches across registered media servers, newest first.
      security:
        - sessionCookie: []
      parameters:
        - name: media_server_id
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/PlaybackHistoryListed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/AuthMethodNotAllowedGet" }
  /api/v1/stats/overview:
    get:
      tags: [stats]
      operationId: getStatsOverview
      summary: Return totals, top-five title and user rankings, and playback breakdowns.
      security: [{ sessionCookie: [] }]
      parameters: &StatsWindowParameters
        - { $ref: "#/components/parameters/StatsDays" }
        - { $ref: "#/components/parameters/StatsMediaServerID" }
        - { $ref: "#/components/parameters/StatsTimeZone" }
      responses: &StatsOverviewResponses
        "200": { $ref: "#/components/responses/StatsOverviewReturned" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "405": { $ref: "#/components/responses/AuthMethodNotAllowedGet" }
  /api/v1/stats/daily:
    get:
      tags: [stats]
      operationId: getStatsDaily
      summary: Return plays and recorded watch seconds by local calendar day.
      security: [{ sessionCookie: [] }]
      parameters: *StatsWindowParameters
      responses:
        <<: *StatsOverviewResponses
        "200": { $ref: "#/components/responses/StatsDailyReturned" }
  /api/v1/stats/patterns:
    get:
      tags: [stats]
      operationId: getStatsPatterns
      summary: Return play counts by local weekday and hour of day.
      security: [{ sessionCookie: [] }]
      parameters: *StatsWindowParameters
      responses:
        <<: *StatsOverviewResponses
        "200": { $ref: "#/components/responses/StatsPatternsReturned" }
  /api/v1/stats/titles:
    get:
      tags: [stats]
      operationId: listStatsTitles
      summary: Return the top 50 titles under one title grouping rule.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/StatsDays" }
        - { $ref: "#/components/parameters/StatsMediaServerID" }
        - { $ref: "#/components/parameters/StatsTimeZone" }
        - { $ref: "#/components/parameters/StatsTitleKind" }
      responses:
        <<: *StatsOverviewResponses
        "200": { $ref: "#/components/responses/StatsTitlesReturned" }
  /api/v1/stats/users:
    get:
      tags: [stats]
      operationId: listStatsUsers
      summary: Return the top 50 media-server users.
      security: [{ sessionCookie: [] }]
      parameters: *StatsWindowParameters
      responses:
        <<: *StatsOverviewResponses
        "200": { $ref: "#/components/responses/StatsUsersReturned" }
  /api/v1/stats/users/{media_server_id}/{media_user_id}:
    get:
      tags: [stats]
      operationId: getStatsUser
      summary: Return one media-server user's dashboard and latest 20 watches.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/StatsPathMediaServerID" }
        - { $ref: "#/components/parameters/StatsMediaUserID" }
        - { $ref: "#/components/parameters/StatsDays" }
        - { $ref: "#/components/parameters/StatsMediaServerID" }
        - { $ref: "#/components/parameters/StatsTimeZone" }
      responses:
        <<: *StatsOverviewResponses
        "200": { $ref: "#/components/responses/StatsUserReturned" }
components:
  parameters:
    StatsDays:
      name: days
      in: query
      schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
    StatsMediaServerID:
      name: media_server_id
      in: query
      schema: { type: string, format: uuid }
    StatsTimeZone:
      name: tz
      in: query
      description: IANA time-zone name used only for calendar buckets.
      schema: { type: string, minLength: 1, x-max-bytes: 64, default: UTC }
    StatsTitleKind:
      name: kind
      in: query
      required: true
      schema: { $ref: "#/components/schemas/StatsTitleKind" }
    StatsPathMediaServerID:
      name: media_server_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatsMediaUserID:
      name: media_user_id
      in: path
      required: true
      schema: { type: string, minLength: 1, x-max-bytes: 256 }
    MediaServerID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z2-7]{26}$" }
    ProviderID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
    EntityID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    CacheControlNoStore:
      description: Prevents storage of a response that touched browser-session state.
      schema:
        type: string
        enum: [no-store]
    CacheControlPublic:
      description: Allows shared caching of the public additive catalog for one hour.
      schema:
        type: string
        const: public, max-age=3600
    VaryCookie:
      description: Marks the response as varying on the inbound Cookie header.
      schema:
        type: string
        enum: [Cookie]
    XRequestID:
      description: Correlation identifier generated or echoed by Bloom.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SetCookie:
      description: Creates, refreshes, or expires the `bloom_session` cookie when applicable.
      schema:
        type: string
    RetryAfter:
      description: Whole seconds until the next attempt may be made. Media-server values are capped at 30 seconds.
      schema:
        type: integer
        minimum: 1
    Location:
      description: Redirect destination.
      schema:
        type: string
        format: uri-reference
  responses:
    InviteCreated:
      description: Invite created. The plaintext code is returned only in this response.
      headers: &AuthenticatedHeaders
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateInviteResponse" }
    InvitesListed:
      description: At most 100 invites ordered newest first.
      headers: *AuthenticatedHeaders
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InvitesResponse" }
    InviteReturned:
      description: Invite metadata without its one-time plaintext code.
      headers: *AuthenticatedHeaders
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Invite" }
    InviteRevoked:
      description: Invite revoked and retained.
      headers: *AuthenticatedHeaders
    InvitePreviewed:
      description: Public server name and validation rules for an acceptable invite.
      headers: &PublicHeaders
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PublicInviteResponse" }
    InviteAccepted:
      description: Jellyfin user created and library access applied.
      headers: *PublicHeaders
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AcceptInviteResponse" }
    PublicInviteNotFound:
      description: Opaque response for an unknown, expired, exhausted, or revoked invite.
      headers: *PublicHeaders
      content: &ErrorContent
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PublicForbidden:
      description: Cross-origin request rejected by CSRF protection.
      headers: *PublicHeaders
      content: *ErrorContent
    PublicConflict:
      description: The requested Jellyfin username is unavailable.
      headers: *PublicHeaders
      content: *ErrorContent
    PublicUnsupportedMediaType:
      description: The acceptance request is not JSON.
      headers: *PublicHeaders
      content: *ErrorContent
    PublicValidationFailed:
      description: The acceptance body or fields are invalid.
      headers: *PublicHeaders
      content: *ErrorContent
    PublicInviteRateLimited:
      description: The client-IP or invite-code rate limit was exceeded.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content: *ErrorContent
    PublicInternalError:
      description: Opaque internal failure.
      headers: *PublicHeaders
      content: *ErrorContent
    PublicMediaServerFailure:
      description: Opaque Jellyfin failure. Transient failures may include Retry-After.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content: *ErrorContent
    PublicMediaServerBusy:
      description: The outbound or acceptance concurrency limit is full.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content: *ErrorContent
    MediaServerCreated:
      description: The connection was proved and stored with its credential encrypted.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateMediaServerResponse" }
    MediaServersListed:
      description: A stable page ordered by the NFC-normalized, case-folded name key.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MediaServersResponse" }
    MediaServerReturned:
      description: Registered server without its credential.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MediaServer" }
    MediaServerDeleted:
      description: Registration deleted.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
    MediaServerProbed:
      description: Current upstream identity.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProbeMediaServerResponse" }
    MediaServerLibrariesListed:
      description: At most 256 media-server libraries. This bounded unpaginated exception lasts until the users slice adds server-side pagination.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibrariesResponse" }
    PlaybackNowListed:
      description: A stable cursor page of open watches ordered by start time and identifier, newest first.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaybackNowResponse" }
    PlaybackHistoryListed:
      description: A stable cursor page of closed watches ordered newest first.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaybackHistoryResponse" }
    StatsOverviewReturned:
      description: Dashboard overview for the resolved window and time zone.
      headers: *AuthenticatedHeaders
      content: { application/json: { schema: { $ref: "#/components/schemas/StatsOverviewResponse" } } }
    StatsDailyReturned:
      description: Local calendar-day statistics for the resolved window.
      headers: *AuthenticatedHeaders
      content: { application/json: { schema: { $ref: "#/components/schemas/StatsDailyResponse" } } }
    StatsPatternsReturned:
      description: Complete seven-weekday and 24-hour play-count buckets.
      headers: *AuthenticatedHeaders
      content: { application/json: { schema: { $ref: "#/components/schemas/StatsPatternsResponse" } } }
    StatsTitlesReturned:
      description: At most 50 ranked title groups.
      headers: *AuthenticatedHeaders
      content: { application/json: { schema: { $ref: "#/components/schemas/StatsTitlesResponse" } } }
    StatsUsersReturned:
      description: At most 50 ranked media-server users.
      headers: *AuthenticatedHeaders
      content: { application/json: { schema: { $ref: "#/components/schemas/StatsUsersResponse" } } }
    StatsUserReturned:
      description: One media-server user's dashboard and at most 20 latest watches.
      headers: *AuthenticatedHeaders
      content: { application/json: { schema: { $ref: "#/components/schemas/StatsUserResponse" } } }
    Unauthorized:
      description: No live authenticated session.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The account lacks the required permission, or the request was rejected as `csrf_rejected`.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The requested resource does not exist.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The requested unique name is already in use, or the requested change otherwise conflicts with existing resource state.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnsupportedMediaType:
      description: The request is not JSON.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: The request body, path UUID, or pagination values are invalid.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    MediaServerFailure:
      description: Opaque upstream media-server failure. Transient failures include a bounded `Retry-After` value.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    MediaServerBusy:
      description: This media server's outbound concurrency limit is full. Retry after the bounded delay.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    MetadataProviderFailure:
      description: Opaque upstream metadata-provider failure. Retryable failures may include Retry-After.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content: &AuthenticatedErrorContent
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    MetadataNotConfigured:
      description: TMDB is not configured or is temporarily unavailable. The error code distinguishes the cause.
      headers: *AuthenticatedHeaders
      content: *AuthenticatedErrorContent
    DownloadManagerFailure:
      description: Opaque upstream Radarr or Sonarr failure. Retryable failures may include Retry-After.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content: *AuthenticatedErrorContent
    QuotaExceeded:
      description: The account's rolling request quota is exhausted.
      headers: *AuthenticatedHeaders
      content: *AuthenticatedErrorContent
    MethodNotAllowed:
      description: The route does not accept the requested HTTP method.
      headers:
        Allow:
          description: Comma-separated methods accepted by this route.
          schema: { type: string, minLength: 1 }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content: *AuthenticatedErrorContent
    AuthMethodNotAllowedGetDelete:
      description: The route accepts only `GET` or `DELETE`.
      headers:
        Allow:
          description: Allowed methods for this route.
          schema: { type: string, const: "GET, DELETE" }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthMethodNotAllowedPostGet:
      description: The route accepts only `POST` or `GET`.
      headers:
        Allow:
          description: Allowed methods for this route.
          schema: { type: string, const: "POST, GET" }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        X-Request-ID: { $ref: "#/components/headers/XRequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthMethodNotAllowedPost:
      description: The route accepts only `POST`.
      headers:
        Allow:
          description: Allowed method for this route.
          schema:
            type: string
            const: POST
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthMethodNotAllowedGet:
      description: The route accepts only `GET`.
      headers:
        Allow:
          description: Allowed method for this route.
          schema:
            type: string
            const: GET
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthInternalError:
      description: Opaque authentication or session failure. `Set-Cookie` may refresh or expire the session.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        Set-Cookie:
          $ref: "#/components/headers/SetCookie"
        Vary:
          $ref: "#/components/headers/VaryCookie"
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Opaque internal failure.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
        Vary: { $ref: "#/components/headers/VaryCookie" }
